name: agentgate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./github-action
        with:
          dashboard_url: ${{ vars.AGENTGATE_DASHBOARD_URL }}
