name: AgentGate
description: Evaluate an agent candidate against a baseline and post the release-gate decision.
inputs:
  config:
    description: Path to .agentgate/config.yaml
    required: false
    default: .agentgate/config.yaml
  dashboard_url:
    description: Optional URL of the AgentGate dashboard. Omitted from the comment when empty.
    required: false
    default: ""
  comment:
    description: Post a pull request comment
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentGate
      shell: bash
      run: python -m pip install "${{ github.workspace }}/backend"
    - name: Evaluate candidate against baseline
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        agentgate evaluate \
          --config "${{ inputs.config }}" \
          --baseline-commit "${BASE_SHA}" \
          --candidate-commit "${HEAD_SHA}" \
          --out agentgate-report.json \
          --keep-going
    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        agentgate comment agentgate-report.json \
          --dashboard-url "${{ inputs.dashboard_url }}" \
          --repository "${{ github.repository }}" \
          --pull-request "${{ github.event.pull_request.number }}" \
          --post
    - name: Apply the gate exit code
      shell: bash
      run: agentgate gate agentgate-report.json
