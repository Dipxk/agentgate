[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "CI/CD release gates for AI agents"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.6,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3",
  "pyyaml>=6.0.2",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[project.scripts]
agentgate = "agentgate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
